name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Patch react-native-pager-view repositories
        run: |
          PAGER_BUILD_GRADLE="node_modules/react-native-pager-view/android/build.gradle"
          if [ -f "$PAGER_BUILD_GRADLE" ]; then
            sed -i 's/mavenCentral()/mavenCentral()\n        gradlePluginPortal()/g' "$PAGER_BUILD_GRADLE"
            echo "Successfully patched react-native-pager-view"
          fi

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNotes-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
