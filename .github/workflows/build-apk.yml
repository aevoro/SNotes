name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Sanitize app.json
        run: |
          sed -i 's/""/"/g' app.json

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install --clean --non-interactive

      - name: Nuclear wipe of Compose from pager-view
        run: |
          TARGET="node_modules/react-native-pager-view/android/build.gradle"
          if [ -f "$TARGET" ]; then
            python3 -c "
          with open('$TARGET', 'r') as f:
              lines = f.readlines()

          filtered = []
          skip = False
          for line in lines:
              if 'composeOptions {' in line or 'buildFeatures {' in line:
                  skip = True
                  continue
              if skip and '}' in line:
                  skip = False
                  continue
              if not skip and not any(bad in line for bad in ['org.jetbrains.kotlin.plugin.compose', 'compose-compiler', 'compose true', 'compose = true']):
                  filtered.append(line)

          with open('$TARGET', 'w') as f:
              f.writelines(filtered)
          "
            echo "=== PATCHED GRADLE FILE ==="
            cat "$TARGET"
          fi

      - name: Configure Gradle Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNotes-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
