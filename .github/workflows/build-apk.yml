name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Sanitize app.json
        run: |
          sed -i 's/""/"/g' app.json

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install --clean --non-interactive

      - name: Completely disable Compose in pager-view
        run: |
          PAGER_GRADLE="node_modules/react-native-pager-view/android/build.gradle"
          if [ -f "$PAGER_GRADLE" ]; then
            # Выключаем compose buildFeatures
            sed -i 's/compose true/compose false/g' "$PAGER_GRADLE"
            # Удаляем плагин compose
            sed -i '/org.jetbrains.kotlin.plugin.compose/d' "$PAGER_GRADLE"
            sed -i '/compose-compiler-gradle-plugin/d' "$PAGER_GRADLE"
          fi

      - name: Configure Gradle Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNotes-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
